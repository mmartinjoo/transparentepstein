[project]
name = "transparentepstein-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "transparentepstein-core",
    "transparentepstein-classification",
    "transparentepstein-ingestion",
]

[project.scripts]
pipeline = "transparentepstein.pipeline.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
transparentepstein-core = { workspace = true }
transparentepstein-classification = { workspace = true }
transparentepstein-ingestion = { workspace = true }

[tool.uv.build-backend]
module-name = "transparentepstein.pipeline"
